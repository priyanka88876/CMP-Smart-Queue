<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CMP Smart Queue</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/forgot.css">
    

    <script type="module" src="../js/forgot-password.js"></script>
</head>
<body>

    <main class="forgot-container">
        <div class="forgot-card">

            <div class="forgot-logo">
    <img src="../assets/cmp-logo.png" alt="CMP College Logo">
</div>

            <h1>Forgot Password?</h1>

            <p class="description">
                Don't worry! Enter your registered email address
                and we will send you a password reset link.
            </p>

            <form id="forgotPasswordForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <button type="submit" id="resetButton">
                    Send Reset Link
                </button>

            </form>

            <p id="resetMessage" role="status" aria-live="polite"></p>

            <a href="./login.html" class="back-link">
                ← Back to Login
            </a>

        </div>
    </main>

</body>
</html>
